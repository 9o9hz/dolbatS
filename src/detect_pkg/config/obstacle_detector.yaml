obstacle_detector_publisher:
  ros__parameters:
    confidence_threshold: 0.5
    # YOLO 감지 상태를 언제든 래치할 수 있도록 상시 추론한다.
    enable_topic: /detect/obstacle/enable
    enabled_at_startup: true
    compressed_image_topic: /camera/lane/raw/compressed
    detected_topic: /detect/obstacle/detected
    bbox_topic: /detect/obstacle/bbox
    detection_image_topic: /camera/lane/detection_view
    show_window: true

ultrasonic_obstacle_event:
  ros__parameters:
    left_distance_topic: /ultrasonic/left/rear
    right_distance_topic: /ultrasonic/right/rear
    event_topic: /detect/obstacle_event
    detect_threshold_cm: 10.0
    clear_threshold_cm: 40.0
    consecutive_frames: 3
    default_avoid_direction: 1

yolo_obstacle_turn:
  ros__parameters:
    yolo_detected_topic: /detect/obstacle/detected
    left_front_distance_topic: /ultrasonic/left/front
    left_rear_distance_topic: /ultrasonic/left/rear
    right_front_distance_topic: /ultrasonic/right/front
    right_rear_distance_topic: /ultrasonic/right/rear
    avoidance_active_topic: /detect/obstacle/avoidance_active
    candidate_steer_topic: /control/candidate/obstacle/steer_angle
    candidate_valid_topic: /control/candidate/obstacle/valid
    status_topic: /detect/avoidance/status
    detect_threshold_cm: 40.0
    clear_threshold_cm: 45.0
    consecutive_frames: 3
    # 펌웨어의 -1.0(에코 없음)을 연속 프레임일 때 뒤 장애물 해제로 취급한다.
    rear_no_echo_is_clear: true
    full_steer_angle_deg: 20.0
    trend_epsilon_cm: 0.5
    minimum_drop_cm: 2.0
    rise_from_minimum_cm: 3.0
    trend_consecutive_frames: 3
    turn_timeout_sec: 8.0
    publish_rate_hz: 30.0
