obstacle_detector_publisher:
  ros__parameters:
    model_filename: dolsoi-model-v2.pt
    confidence_threshold: 0.5
    enable_topic: /detect/obstacle/enable
    enabled_at_startup: true
    compressed_image_topic: /camera/lane/raw/compressed
    detected_topic: /detect/obstacle/detected
    bbox_topic: /detect/obstacle/bbox
    ultrasonic_enable_topic: /detect/obstacle/ultrasonic_enabled
    ultrasonic_event_topic: /detect/obstacle_event
    avoidance_steer_topic: /control/candidate/obstacle/steer_angle
    avoidance_valid_topic: /control/candidate/obstacle/valid
    detection_image_topic: /camera/lane/detection_view/compressed
    detection_jpeg_quality: 80
    show_window: true
    # yolo_only가 발행하는 실제 트리거 ROI와 회피 종료선을 감지 영상에 표시한다.
    show_yolo_only_guides: true
    avoidance_status_topic: /detect/avoidance/status

yolo_obstacle_yolo_only:
  ros__parameters:
    yolo_detected_topic: /detect/obstacle/detected
    bbox_topic: /detect/obstacle/bbox
    raw_image_topic: /camera/lane/raw
    fallback_image_width_px: 640
    fallback_image_height_px: 480

    # bbox 중심점이 들어와야 하는 직접 ROI. bottom=0.90이면 화면 하단
    # 10%는 트리거 영역에서 제외되며, 감지 영상에 하단 제한선이 표시된다.
    middle_left_ratio: 0.2
    middle_right_ratio: 0.8
    roi_top_ratio: 0.0
    roi_bottom_ratio: 0.90
    # bbox 면적 / 전체 화면 면적. 0.025는 화면 면적의 2.5%이다.
    min_bbox_area_ratio: 0.020

    # 첫 회피 방향. 이후 장애물마다 L/R을 번갈아 사용한다.
    # launch의 avoid_direction:=L 또는 R 인자가 이 값을 덮어쓴다.
    avoid_direction: L
    full_steer_angle_deg: 25.5

    # yolo_end와 동일한 bbox 기반 회피 종료 조건
    # 왼쪽 회전은 bbox 중심이 오른쪽 경계선을, 오른쪽 회전은 bbox 중심이
    # 왼쪽 경계선을 이 횟수만큼 연속 통과하면 회피를 종료한다.
    bbox_left_boundary_ratio: 0.20
    bbox_right_boundary_ratio: 0.80
    bbox_exit_consecutive_frames: 2

    # 회피 종료 후 YOLO 미감지가 이 프레임 수만큼 이어져야 재무장한다.
    rearm_clear_frames: 1

    avoidance_active_topic: /detect/obstacle/avoidance_active
    candidate_steer_topic: /control/candidate/obstacle/steer_angle
    candidate_valid_topic: /control/candidate/obstacle/valid
    status_topic: /detect/avoidance/status
    publish_rate_hz: 30.0
