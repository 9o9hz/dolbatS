drive_main:
  ros__parameters:
    # 현재 차량에서 실측한 YOLO 모델과 0731 BEV 보정값.
    model_path: "src/drive_pkg/resource/best.pt"
    bev_params: "src/drive_pkg/resource/bev_params_0731.npz"
    calibration_width: 640
    calibration_height: 480

    # 카메라 undistort. calib_file이 빈 문자열이거나 로드에 실패하면
    # 경고만 남기고 undistort 없이 진행한다.
    calib_file: "camera_calibration.npz"
    use_undistort: true

    confidence: 0.25
    image_size: 640
    device: "auto"
    process_every_nth_frame: 1

    image_topic: "/camera/lane/raw/compressed"
    bev_topic: "/lane/detection/bev/compressed"
    mask_topic: "/lane/detection/mask/compressed"
    segmentation_topic: "/lane/detection/segmentation/compressed"
    detection_status_topic: "/lane/detection/status"
    instances_topic: "/lane/detection/instances"

    # BEV 픽셀 좌표를 차량 기준 metric path로 바꾸는 실측값.
    # BEV 640x640px 기준: 가로 1.02m, 세로 1.36m 실측(0731).
    pixels_per_meter_x: 627.5
    pixels_per_meter_y: 470.6
    line_width_target_m: 0.050
    line_width_tolerance_m: 0.010
    line_width_recovery_tolerance_m: 0.015
    line_width_recovery_aspect_ratio: 1.20
    line_width_measurement_scale: 0.80
    # 횡단보도 흰 줄 오탐 방지: BEV상 가로(진행방향에 수직)가 세로보다
    # 이 배율 이상 넓으면 차선 후보에서 제외한다. 모델에 crosswalk
    # 클래스가 없어 흰 페인트를 dashed/solid로 오분류하는 걸 기하학적으로 거른다.
    crosswalk_max_aspect_ratio: 1.50
    lane_width_m: 0.85
    # 둘 이상의 경계를 함께 사용할 때 허용하는 최소 중심 간격.
    min_boundary_spacing_m: 0.80
    # 850mm 기준 ±50mm 범위 밖이면 confidence 높은 한 선만 사용.
    max_boundary_spacing_m: 0.90
    # 후륜축 중심에서 BEV 하단 기준점까지의 전방 거리.
    # BEV 설정시마다 변경
    bev_reference_forward_offset_m: 1.04

    # 차선 조각 결합 및 좌/우 경계 선택.
    # bbox_close_ksize: 검출(bbox) 단위로 최대 성분을 뽑기 전 적용하는
    # morphological close 커널 크기.
    min_component_area: 250
    center_sample_step: 5
    bbox_close_ksize: 5
    same_line_threshold_px: 75.0
    min_group_span_px: 80.0
    min_group_area: 500
    dashed_piece_threshold: 2
    prefer_solid_when_dashed: true
    initial_lane: "lane_2"
    lane_state_confirm_frames: 3
    lane_track_max_age_frames: 5
    lane_track_match_threshold_px: 50.0
    solid_enter_frames: 4
    solid_exit_frames: 6

    # 기존 로컬의 다항식 경로 생성 및 시간축 평활화.
    path_top_y: 180
    path_bottom_margin: 30
    path_step_px: 10
    path_resample_step_px: 5
    path_polynomial_degree: 3
    path_ema_alpha: 0.30
    path_transition_blend_frames: 7
    max_path_lateral_step_m: 0.04
    max_missing_frames: 12

    path_topic: "/lane/path"
    debug_topic: "/lane/path/debug/compressed"
    path_status_topic: "/lane/path/status"
    which_lane_topic: "/which/lane"
    path_frame_id: "base_link"

    debug_jpeg_quality: 80
    # drive_main 자체 프로세스에서 segmentation/경로 미리보기만 보고 싶을 때
    # 켜는 간단한 디버그 창(제어 오버레이 없음). 통합 시각화는
    # pure_pursuit의 local_display를 쓴다.
    local_display: false
    display_scale: 1.0


pure_pursuit:
  ros__parameters:
    path_topic: "/lane/path"
    path_status_topic: "/lane/path/status"
    # 통합 구성: pure_pursuit는 최종 /auto_*가 아닌 lane 후보만 발행한다.
    # mission_manager는 valid일 때 받은 마지막 조향 후보를 유지한다.
    steer_angle_topic: "/control/candidate/lane/steer_angle"
    candidate_valid_topic: "/control/candidate/lane/valid"
    throttle_feedback_topic: "/auto_throttle"
    status_topic: "/lane/control/status"

    wheelbase_m: 0.545
    max_steer_deg: 25.0
    steering_gain: 5.00
    # true: 조향각에 따라 min~max 사이에서 목표점 이동.
    # false: lookahead_m 거리의 고정 목표점 사용.
    dynamic_lookahead_enabled: true
    lookahead_m: 1.35
    ld_throttle_min: 0.5
    ld_throttle_max: 0.8
    lookahead_min_m: 1.3
    lookahead_max_m: 1.55
    # lookahead 목표점 탐색 방식: "simple"(|거리-LD| 최소, 로컬 기본값) / 
    # "arc_length"(가장 가까운 점부터 누적 호길이로 LD 지점 탐색).
    lookahead_search_mode: "simple"

    steering_ema_alpha: 0.65
    steering_deadband_deg: 0.3
    max_steering_change_deg: 12.0

    # main5.py 스타일 통합 cv2 창(segmentation | BEV 제어 | 검출선+경로).
    # path_visualizer 별도 노드를 없애고 이 프로세스에 흡수한 것 — 헤드리스
    # 환경에서는 false로 끈다.
    local_display: true
    segmentation_topic: "/lane/detection/segmentation/compressed"
    bev_topic: "/lane/detection/bev/compressed"
    debug_topic: "/lane/path/debug/compressed"
    instances_topic: "/lane/detection/instances"
    window_name: "drive visualizer: segmentation | BEV control | lines + path"
    window_x: 20
    window_y: 60
    display_scale: 0.90
    # 박스 위치 평활화와 DASHED/SOLID 전환 히스테리시스.
    box_ema_alpha: 0.15
    type_switch_frames: 5
    track_max_missed_frames: 12
    track_match_distance_px: 140.0
    confidence_full_hits: 5
    # 같은 선과 겹치는 여러 YOLO 마스크 confidence 집계 방식: mean/max.
    yolo_confidence_aggregation: "mean"
    # 토픽 한두 프레임 누락 시에만 표시를 유지하고 이후 자동 제거.
    lookahead_target_hold_sec: 0.45
    reference_path_hold_sec: 0.45
