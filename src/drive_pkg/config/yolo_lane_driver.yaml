yolo_lane_driver:
  ros__parameters:
    # ================================================================
    # 1. 자주 조정하는 주행 파라미터
    # ================================================================
    # false이면 경로는 계산하지만 /cmd_vel은 항상 0으로 발행한다.
    enable_drive: false
    speed_mps: 0.18
    max_steer_deg: 18.0
    wheelbase_m: 0.545

    # 차선을 잠시 놓쳐 이전 경로를 사용할 때의 속도 비율이다.
    hold_speed_scale: 0.75

    # ================================================================
    # 2. 차량 실측값 및 BEV 거리 환산
    # ================================================================
    lane_width_m: 0.90

    # 후륜축 중심에서 현재 BEV 하단 기준점(차량 앞코)까지의 전방 거리.
    # BEV 기준점이 바뀌면 이 값을 다시 실측하여 수정한다.
    bev_reference_forward_offset_m: 1.04

    # BEV 픽셀-미터 환산값. BEV 스케일이 바뀌면 함께 재측정한다.
    pixels_per_meter: 600.0
    calibration_width: 640
    calibration_height: 480

    # ================================================================
    # 3. 동적 Look-ahead Distance
    # ================================================================
    # 직선(조향각 0도)에서는 max, 최대 조향각에서는 min을 사용한다.
    lookahead_min_m: 1.10
    lookahead_max_m: 2.50

    # -1.0이면 위 min/max를 이용한 동적 LD를 사용한다.
    # 양수로 지정하면 해당 거리로 LD를 고정한다.
    lookahead_m: -1.0

    # ================================================================
    # 4. 조향 필터
    # ================================================================
    # 클수록 새 조향값을 빠르게 반영한다. 범위: 0.0~1.0
    steering_ema_alpha: 0.35
    steering_deadband_deg: 0.8
    max_steering_change_deg: 3.0

    # ================================================================
    # 5. 차선 조각 결합 및 곡선 경로 생성
    # ================================================================
    min_component_area: 250
    center_sample_step: 5
    same_line_threshold_px: 75.0
    min_group_span_px: 80.0
    min_group_area: 500

    # 같은 곡선에서 분리 마스크가 2개 이상이면 점선으로 판정한다.
    # 점선과 연속된 실선이 함께 보이면 실선만 기준 경계로 사용한다.
    dashed_piece_threshold: 2
    prefer_solid_when_dashed: true

    # 좌/우 차선을 이전 프레임의 위치와 곡선 형태로 추적한다.
    # 일시적으로 검출되지 않아도 max_age 동안 기존 경계를 유지한다.
    lane_track_max_age_frames: 7
    lane_track_match_threshold_px: 90.0

    # 실선 우선 모드는 enter 프레임 연속 확인 후 진입하고,
    # 조건이 exit 프레임 연속 사라진 뒤 해제한다.
    solid_enter_frames: 4
    solid_exit_frames: 6

    # 생성 경로의 BEV y 범위와 샘플 간격.
    path_top_y: 180
    path_bottom_margin: 30
    path_step_px: 10
    path_resample_step_px: 5

    # 최종 경로는 고정 y-grid로 재표본화한 뒤 시간축 평활화한다.
    # 추종 경계가 바뀌면 blend_frames 동안 천천히 새 경로로 전환한다.
    path_ema_alpha: 0.35
    path_transition_blend_frames: 6
    max_path_lateral_step_m: 0.04
    max_missing_frames: 8

    # ================================================================
    # 6. YOLO 추론
    # ================================================================
    model_path: "/home/tak/lane_yolo_project/weight/best1.pt"
    confidence: 0.25
    image_size: 640
    device: "auto"
    process_every_nth_frame: 1

    # ================================================================
    # 7. 입력, 출력 및 디버그
    # ================================================================
    bev_params: "/home/tak/dolbatS/src/drive_pkg/resource/bev_params_7.npz"
    image_topic: "/image_raw/compressed"
    path_topic: "/lane/path"
    segmentation_topic: "/lane/yolo_drive/segmentation/compressed"
    debug_topic: "/lane/yolo_drive/path/compressed"
    status_topic: "/lane/yolo_drive/status"
    which_lane_topic: "/which/lane"
    cmd_vel_topic: "/cmd_vel"
    path_frame_id: "base_link"

    display: true
    display_scale: 1.0
    debug_jpeg_quality: 80
